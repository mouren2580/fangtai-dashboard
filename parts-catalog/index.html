<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配件查询系统</title>
<style>
  :root{
    --brand:#D6001C; --brand-soft:#FFF1EE;
    --ink:#1B1D21; --ink-2:#4A5058; --ink-3:#8A9099;
    --line:#E8EBEF; --bg:#F5F6F8; --card:#FFFFFF;
    --yes:#C1121F; --no:#0F7B4F; --hl:#FFE9A8;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);
       font-size:14px;line-height:1.6;padding-bottom:60px}
  .hero{background:linear-gradient(135deg,#C40019 0%,#E63524 55%,#F2711C 100%);
        color:#fff;padding:26px 20px 74px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;
        border-radius:50%;background:rgba(255,255,255,.09)}
  .hero::before{content:"";position:absolute;right:80px;bottom:-90px;width:180px;height:180px;
        border-radius:50%;background:rgba(255,255,255,.07)}
  .hero-inner{max-width:1180px;margin:0 auto;position:relative;z-index:1}
  .brandline{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;
        opacity:.92;font-weight:600}
  .brandline .dot{width:6px;height:6px;border-radius:50%;background:#FFD9A0}
  h1{margin:12px 0 6px;font-size:26px;line-height:1.3;letter-spacing:.5px}
  .sub{font-size:13.5px;opacity:.9;max-width:680px}
  .hero-stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
  .hs{display:flex;align-items:baseline;gap:7px}
  .hs b{font-size:21px}.hs span{font-size:12.5px;opacity:.85}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
        margin-top:-52px;padding:18px;position:relative;z-index:2}
  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.42}
  #q{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;
     padding:0 42px 0 44px;font-size:15.5px;color:var(--ink);background:#FBFCFD;
     outline:none;transition:.18s;font-family:inherit}
  #q:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(214,0,28,.07)}
  #clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;
     background:#EDEFF2;color:#767C85;width:24px;height:24px;border-radius:50%;
     cursor:pointer;display:none;font-size:15px;line-height:1;padding:0}
  #clear:hover{background:#E1E4E9;color:#3F444B}
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:10px;margin-top:12px}
  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld label{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.06em}
  select,.btn{height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
     font-size:13.5px;color:var(--ink-2);padding:0 12px;outline:none;font-family:inherit;
     cursor:pointer;transition:.15s;width:100%}
  select:focus{border-color:var(--brand)}
  .btn{align-self:flex-end;white-space:nowrap;width:auto;padding:0 20px;font-weight:600;
     color:var(--ink-2);background:#F7F8FA}
  .btn:hover{background:#EEF0F3;border-color:#D6DAE0}
  .metabar{display:flex;align-items:center;justify-content:space-between;gap:12px;
     margin:20px 0 10px;flex-wrap:wrap}
  .count{font-size:13.5px;color:var(--ink-2)}
  .count b{color:var(--brand);font-size:17px;margin:0 2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);
     color:var(--brand);border:1px solid #FFD9D0;border-radius:99px;padding:3px 10px;
     font-size:12px;font-weight:600}
  .chip i{cursor:pointer;font-style:normal;opacity:.6}.chip i:hover{opacity:1}
  .tablecard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%}
  thead th{position:sticky;top:0;z-index:3;background:#FAFBFC;text-align:left;font-size:12.5px;
     color:var(--ink-3);font-weight:700;letter-spacing:.05em;padding:12px 14px;
     border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  thead th:hover{color:var(--brand)}
  thead th .ar{opacity:.35;margin-left:3px;font-size:10px}
  thead th.on .ar{opacity:1;color:var(--brand)}
  tbody td{padding:11px 14px;border-bottom:1px solid #F1F3F5;font-size:13.5px;
     vertical-align:middle;color:var(--ink)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FDF6F4}
  .c-grp{color:var(--ink-2);white-space:nowrap;font-weight:600}
  .c-cat{color:var(--ink-2);white-space:nowrap}
  .c-code{white-space:nowrap}
  .c-tag{white-space:nowrap}
  .code{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
     font-size:12.5px;background:#F3F5F8;border:1px solid #E6E9EE;border-radius:6px;
     padding:3px 8px;color:#2A2F36;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .code:hover{background:#EDF0F4;border-color:#D5DAE1}
  .code:active{transform:scale(.97)}
  .code .cp{font-size:10px;color:var(--ink-3)}
  .c-name{min-width:280px;word-break:break-word}
  mark{background:var(--hl);color:#8A4B00;border-radius:3px;padding:0 1px;font-weight:600}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;
     border-radius:99px;white-space:nowrap;color:var(--yes);background:#FDECEE;border:1px solid #FAD3D6}
  .tag.n{color:var(--no);background:#E9F6F0;border-color:#C8EADB}
  .tag.o{color:var(--ink-2);background:#F2F4F7;border-color:#E3E7EC}
  .empty{padding:70px 20px;text-align:center;color:var(--ink-3)}
  .empty .big{font-size:40px;margin-bottom:10px;opacity:.5}
  .more{padding:16px;text-align:center}
  .more button{height:40px;padding:0 26px;border-radius:10px;border:1.5px solid var(--line);
     background:#fff;color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .more button:hover{border-color:var(--brand);color:var(--brand)}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);opacity:0;
     background:#20242A;color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;
     pointer-events:none;transition:.24s;z-index:99;white-space:nowrap}
  .toast.show{opacity:.95;transform:translate(-50%,0)}
  .foot{max-width:1180px;margin:22px auto 0;padding:0 20px;font-size:12px;color:var(--ink-3);line-height:1.9}
  @media (max-width:860px){
    .hero{padding:22px 16px 68px} h1{font-size:21px}
    .wrap{padding:0 12px} .panel{padding:14px;margin-top:-48px}
    .filters{grid-template-columns:1fr 1fr}
    .btn{grid-column:2/3;width:100%}
    .foot{padding:0 12px}
  }
</style>
</head>

<div class="hero"><div class="hero-inner">
  <div class="brandline"><span class="dot"></span>方太 · 用户可自购配件目录</div>
  <h1>配件查询系统</h1>
  <div class="sub">输入配件名称或编码即可秒查，支持按产品组、类别、是否需保有我司产品组合筛选。</div>
  <div class="hero-stats">
    <div class="hs"><b id="s-total">0</b><span>条记录</span></div>
    <div class="hs"><b id="s-f1">0</b><span id="l-f1">分类</span></div>

</div></div>

<div class="wrap">

    <div class="filters" id="filters"></div>

  <div class="metabar">

  <div class="tablecard">

    <div class="more hidden" id="more"><button id="moreBtn">加载更多</button></div>
  </div>
</div>

const FILTERS = [{"idx":0,"name":"产品组","options":["下排集成灶","冰箱","吸油烟机","家用净水机","嵌入式洗碗机","微波炉","服务产品","水槽洗碗机","洗地机","消毒柜","灶具","灶消烹饪机","灶蒸烤烹饪机","灶蒸烹饪机","烤箱","热水器","蒸微一体机","蒸烤微烹饪机","蒸烤烹饪机","蒸箱","集成式洗碗机"]},{"idx":1,"name":"类别","options":["hepa滤网","上喷淋臂组件","上碗架组件","下水器上盖组件","下碗架组件","主喷淋臂组件","侧支架","内机滤网（A1.i）","冷冻托盘","刀架","前橡胶垫/控湿插片","前过滤板","前过滤板组件","包覆管（气路）","化妆盒","可拆电源线","喷淋臂","外丝转宝塔接头","导风板","抽屉","抽屉隔板","拉篮","拉篮组件","排烟盖板","接水盒组件","接油盘","揉面刀","搅拌刀","整锅","旋钮","杯贴","果蔬篮","格栅/油网","水垢清除剂（除垢剂）","水箱","沥水板","沥水板组件","沥水篮","沥水篮组件","油杯","波纹管（水路、气路）","洗碗耗材","清洁剂","渣篮","渣篮组件","滤篮","火盖","灯管","烤架","烤盘","玻璃层架","玻璃盘/玻璃接油盘","球阀","电池","碗架","碟架","移动槽盖板","移动槽组件","筷子笼","筷子笼组件","聚能圈","菜篮组件","蒸架","蒸烤架","蒸烤盘","蒸盘","蝶翼板","解冻板","转动胶轴","转动胶轴垫圈","转盘支承","过滤板","连接线","遥控器","酒架","铜圈","锅支架","锅盖","门搁架","防污板","防溅板","顶碗架框","餐具盒","魔术底"]}];
const CLS = ["c-grp","c-cat","c-tag","c-code","c-name"];
const PAGE = 200;
const TAG = 2;

const $ = id => document.getElementById(id);
const qEl = $('q');
const sels = [];
let state = { kw:'', fv:{}, sortK:null, sortD:1, shown:PAGE, hits:[] };

/* ---------- 顶部统计 ---------- */
$('s-total').textContent = DATA.length;
if (FILTERS[0]) { $('s-f1').textContent = FILTERS[0].options.length; $('l-f1').textContent = FILTERS[0].name; }
else { $('s-f1').parentElement.classList.add('hidden'); }
if (FILTERS[1]) { $('s-f2').textContent = FILTERS[1].options.length; $('l-f2').textContent = FILTERS[1].name; }
else { $('s-f2').parentElement.classList.add('hidden'); }

/* ---------- 筛选下拉 ---------- */
FILTERS.forEach((f, fi) => {
  const box = document.createElement('div'); box.className = 'fld';
  const lab = document.createElement('label'); lab.textContent = f.name;
  const sel = document.createElement('select');
  sel.add(new Option('全部' + f.name, ''));
  f.options.forEach(o => sel.add(new Option(o, o)));
  sel.onchange = () => { state.fv[f.idx] = sel.value; if (fi === 0) syncSecond(); update(); };
  box.appendChild(lab); box.appendChild(sel);
  $('filters').appendChild(box);
  sels.push(sel);
});
// 重置按钮
const rb = document.createElement('button'); rb.className = 'btn'; rb.textContent = '重置筛选';
rb.onclick = () => {
  qEl.value=''; state.kw=''; state.fv={}; state.sortK=null; state.sortD=1;
  sels.forEach(s=>s.value=''); syncSecond(); $('clear').style.display='none'; update();
};
$('filters').appendChild(rb);

function syncSecond(){
  if (FILTERS.length < 2) return;
  const f = FILTERS[1], g = FILTERS[0];
  const gv = state.fv[g.idx] || '';
  const opts = gv ? [...new Set(DATA.filter(r => r[g.idx] === gv).map(r => r[f.idx]))].sort()
                  : f.options;
  const keep = state.fv[f.idx] || '';
  sels[1].innerHTML = '';
  sels[1].add(new Option('全部' + f.name, ''));
  opts.forEach(o => sels[1].add(new Option(o, o)));
  if (keep && opts.includes(keep)) { sels[1].value = keep; state.fv[f.idx] = keep; }
  else state.fv[f.idx] = '';
}

/* ---------- 搜索 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function hl(text, kw){
  if (!kw) return esc(text);
  const parts = kw.trim().split(/\s+/).filter(Boolean).map(escRe);
  if (!parts.length) return esc(text);
  const re = new RegExp('(' + parts.join('|') + ')', 'gi');
  return String(text).split(re).map((s, i) => (i % 2 === 1) ? '<mark>' + esc(s) + '</mark>' : esc(s)).join('');
}

function search(){
  const kws = state.kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let out = DATA.filter(r => {
    for (const k in state.fv) { const v = state.fv[k]; if (v && r[k] !== v) return false; }
    if (!kws.length) return true;
    const hay = r.join(' ').toLowerCase();
    return kws.every(k => hay.includes(k));
  });
  if (state.sortK !== null) {
    const k = state.sortK, d = state.sortD;
    out = out.slice().sort((a, b) => String(a[k]).localeCompare(String(b[k]), 'zh') * d);
  }
  state.hits = out;
}

function render(reset){
  if (reset) state.shown = PAGE;
  const list = state.hits;
  $('s-hit').textContent = list.length;
  $('s-sub').textContent = (list.length && list.length !== DATA.length) ? '（全库 ' + DATA.length + ' 条）' : '';

  const chips = [];
  if (state.kw) chips.push(['关键词：' + state.kw, 'kw']);
  FILTERS.forEach(f => { if (state.fv[f.idx]) chips.push([state.fv[f.idx], 'f' + f.idx]); });
  $('chips').innerHTML = chips.map(([t, k]) =>
    '<span class="chip">' + esc(t) + '<i data-c="' + k + '">×</i></span>').join('');
  $('chips').querySelectorAll('i').forEach(el => el.onclick = () => {
    const k = el.dataset.c;
    if (k === 'kw') { state.kw = ''; qEl.value = ''; $('clear').style.display = 'none'; }
    else { const idx = +k.slice(1); state.fv[idx] = ''; sels[FILTERS.findIndex(f => f.idx === idx)].value = ''; syncSecond(); }
    update();
  });

  document.querySelectorAll('thead th').forEach(th => {
    th.classList.toggle('on', state.sortK !== null && +th.dataset.k === state.sortK);
  });

  const slice = list.slice(0, state.shown);
  $('tbody').innerHTML = slice.map(r => '<tr>' + r.map((v, i) => {
    const c = CLS[i];
    if (c === 'c-code') return '<td class="c-code"><span class="code" data-code="' + esc(v) + '" title="点击复制">' + hl(v, state.kw) + '<span class="cp">复制</span></span></td>';
    if (c === 'c-tag') return '<td class="c-tag"><span class="tag' + (v === '否' ? ' n' : (v === '是' ? '' : ' o')) + '">' + esc(v) + '</span></td>';
    return '<td class="' + c + '">' + hl(v, state.kw) + '</td>';
  }).join('') + '</tr>').join('');

  $('empty').classList.toggle('hidden', list.length > 0);
  const remain = list.length - slice.length;
  $('more').classList.toggle('hidden', remain <= 0);
  if (remain > 0) $('moreBtn').textContent = '加载更多（还有 ' + remain + ' 条）';
}

function update(){ search(); render(true); }

/* ---------- 事件 ---------- */
let timer = null;
qEl.addEventListener('input', () => {
  state.kw = qEl.value;
  $('clear').style.display = qEl.value ? 'block' : 'none';
  clearTimeout(timer); timer = setTimeout(update, 160);
});
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); update(); } });
$('clear').onclick = () => { qEl.value=''; state.kw=''; $('clear').style.display='none'; qEl.focus(); update(); };
$('moreBtn').onclick = () => { state.shown += PAGE; render(false); };
document.querySelectorAll('thead th').forEach(th => {
  th.onclick = () => {
    const k = +th.dataset.k;
    if (state.sortK === k) state.sortD *= -1; else { state.sortK = k; state.sortD = 1; }
    render(true);
  };
});
document.addEventListener('click', e => {
  const el = e.target.closest('.code');
  if (!el) return;
  copyText(el.dataset.code);
});
function copyText(code){
  const done = () => {
    toast('已复制：' + code);
    const cps = document.querySelectorAll('.code');
    cps.forEach(el => { if (el.dataset.code === code) { const p = el.querySelector('.cp'); const o = p.textContent; p.textContent = '已复制'; setTimeout(() => p.textContent = o, 1200); } });
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done).catch(() => fb(code, done));
  else fb(code, done);
}
function fb(text, cb){
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); cb();
}
let tt = null;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1600);
}

update();
qEl.focus();
</script>
