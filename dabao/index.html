<html lang="zh-CN">

<meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:#F5F4F2;color:#1F2328;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:880px;margin:0 auto}

/* ============ header ============ */
header{background:linear-gradient(135deg,#A81C2A 0%,#C8102E 45%,#E0512F 100%);color:#fff;padding:20px 16px 18px}
.brand{font-size:11px;letter-spacing:2.5px;font-weight:700;opacity:.82}
h1{font-size:21px;margin:7px 0 6px;font-weight:800;letter-spacing:.3px}
.sub{margin:0;font-size:12.5px;line-height:1.6;opacity:.92}
.chips{margin-top:13px;display:flex;gap:7px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:4px 10px;
border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip b{font-weight:800}

/* ============ 搜索区 ============ */
.sticky{position:sticky;top:0;z-index:30;background:rgba(245,244,242,.95);
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 16px 10px;
border-bottom:1px solid rgba(0,0,0,.05)}
.sbox{position:relative}
#q{width:100%;height:52px;border-radius:14px;border:1.5px solid #E4E1DC;background:#fff;
padding:0 46px 0 46px;font-size:16px;color:#1F2328;outline:none;
box-shadow:0 2px 10px rgba(24,20,16,.05);transition:.16s;font-family:inherit}
#q::placeholder{color:#A7ADB4;font-size:15px}
#q:focus{border-color:#C8102E;box-shadow:0 0 0 4px rgba(200,16,46,.09),0 2px 10px rgba(24,20,16,.06)}
.sicon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#A7ADB4;pointer-events:none}
#clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
border:0;background:#EFEDE9;color:#6B7178;font-size:18px;line-height:1;cursor:pointer;display:none;padding:0}
#clr:active{background:#E3E0DB}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;padding:9px 12px;border-radius:11px;border:1px solid #E4E1DC;background:#fff;
font-size:13.5px;font-weight:800;color:#5E646B;cursor:pointer;font-family:inherit;transition:.14s}
.tab .num{font-size:11px;font-weight:700;opacity:.6;margin-left:3px}
.tab.on{background:#B7202E;border-color:#B7202E;color:#fff;box-shadow:0 3px 10px rgba(183,32,46,.24)}
.tab.on .num{opacity:.8}

/* ============ 结果栏 ============ */
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
padding:14px 16px 9px;font-size:12.5px;color:#8A9099}
.meta b{color:#B7202E;font-weight:800;font-size:14px}
.meta .hint{font-size:11.5px;color:#A7ADB4}
.mini{border:1px solid #E4E1DC;background:#fff;color:#5E646B;font-size:11.5px;font-weight:800;
padding:5px 10px;border-radius:99px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.14s}
.mini b{color:#B7202E;margin-left:3px}
.mini.on{background:#B7202E;border-color:#B7202E;color:#fff}
.mini.on b{color:#fff}
.mini[hidden]{display:none}

/* ============ 卡片 ============ */
#list{padding:0 16px 40px;min-height:52vh}
.card{background:#fff;border-radius:14px;padding:14px 15px 13px;margin-bottom:11px;
border:1px solid #EDEAE5;box-shadow:0 1px 3px rgba(24,20,16,.045)}
.mrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.model{font-size:17px;font-weight:800;line-height:1.3;word-break:break-word;letter-spacing:.2px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;
margin-left:7px;vertical-align:3px;letter-spacing:.5px}
.badge.new{background:#C8102E;color:#fff}
.badge.upd{background:#EAF2FB;color:#1F6FB2;border:1px solid #CFE2F5}
.badge.warn{background:#FFF1E0;color:#C4720C;border:1px solid #FFD9A8}
.cnt{font-size:11.5px;font-weight:800;color:#B7202E;background:#FDECEE;border-radius:8px;
padding:4px 8px;white-space:nowrap;flex:0 0 auto}
.sub2{margin-top:6px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12px;color:#8A9099}
.codeln{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-weight:700;color:#6B7178;
border-bottom:1px dashed #D9D5CF;padding-bottom:1px}
.codeln:active{color:#B7202E;border-color:#B7202E}
.codeln svg{width:11px;height:11px;opacity:.65}
.gtag{background:#F3F1EE;border-radius:5px;padding:2px 6px;font-weight:700;color:#8A9099;font-size:11px}

.parts{margin-top:10px;border-top:1px solid #F2EFEA}
.part{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F7F5F2}
.part:last-child{border-bottom:0;padding-bottom:2px}
.no{width:19px;height:19px;border-radius:50%;background:#F4F2EF;color:#9AA0A6;font-size:10.5px;
font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.pbody{flex:1;min-width:0}
.pname{font-size:13.5px;font-weight:600;line-height:1.4;word-break:break-word;color:#2C3138}
.pcode{display:inline-flex;align-items:center;gap:4px;margin-top:4px;cursor:pointer;
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;
color:#B7202E;background:#FDF5F5;border:1px solid #F5DFE1;border-radius:6px;padding:2px 7px}
.pcode:active{background:#FAE7E9}
.pcode svg{width:10px;height:10px;opacity:.7}
.qty{flex:0 0 auto;font-size:13.5px;font-weight:800;color:#1F2328;font-variant-numeric:tabular-nums}
.qty small{font-size:11px;font-weight:700;color:#9AA0A6}
.qty.zero{color:#C4720C;font-size:11.5px;font-weight:800}

.copyall{width:100%;margin-top:11px;height:36px;border-radius:9px;border:1px solid #EFDADC;
background:#FFFCFC;color:#B7202E;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.copyall:active{background:#FDF2F3;border-color:#E4B9BD}

/* 配件模式卡片 */
.pcard{background:#fff;border-radius:14px;padding:14px 15px;margin-bottom:11px;
border:1px solid #EDEAE5;box-shadow:0 1px 3px rgba(24,20,16,.045)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pn{font-size:15px;font-weight:800;line-height:1.35;word-break:break-word}
.pc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;
color:#B7202E;background:#FDF5F5;border:1px solid #F5DFE1;border-radius:6px;padding:2px 7px;
margin-top:6px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.mlist{margin-top:11px;padding-top:10px;border-top:1px solid #F2EFEA;display:flex;flex-wrap:wrap;gap:6px}
.mtag{font-size:12px;font-weight:700;color:#41474E;background:#F4F2EF;border-radius:7px;
padding:5px 9px;cursor:pointer;border:1px solid transparent}
.mtag:active{background:#FDECEE;color:#B7202E;border-color:#F5DFE1}
.mlab{width:100%;font-size:11.5px;color:#A7ADB4;font-weight:700;margin-bottom:2px}

/* 空态 */
.empty{text-align:center;padding:52px 24px;color:#8A9099}
.empty .big{display:flex;justify-content:center;margin-bottom:12px}
.empty .big svg{width:44px;height:44px;color:#D9D4CD}
.empty h3{font-size:15px;color:#41474E;margin:0 0 8px;font-weight:800}
.empty p{font-size:12.5px;line-height:1.7;margin:0}
.empty code{background:#fff;border:1px solid #EDEAE5;border-radius:5px;padding:1px 6px;
font-family:ui-monospace,monospace;color:#B7202E;font-weight:700}

mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.more{text-align:center;padding:14px 0 4px}
.more button{border:1px solid #E4E1DC;background:#fff;color:#5E646B;font-weight:800;font-size:13px;
padding:10px 26px;border-radius:10px;cursor:pointer;font-family:inherit}

footer{padding:0 16px 34px;text-align:center;font-size:11.5px;color:#A7ADB4;line-height:1.8}
footer b{color:#8A9099}

/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:rgba(31,35,40,.93);
color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;
transition:.22s;pointer-events:none;z-index:99;white-space:nowrap;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 桌面端双列，信息密度更高 */
@media (min-width:860px){
  #list{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .card,.pcard{margin-bottom:0}
  .more,.empty{grid-column:1/-1}
}
@media (min-width:1120px){
  .wrap{max-width:1080px}
}
@media (max-width:520px){
  header{padding:16px 14px 14px}
  h1{font-size:19px;margin:6px 0 5px}
  .sub{font-size:12px;line-height:1.55}
  .chips{margin-top:10px;gap:6px}
  .chip{padding:3px 9px;font-size:11px}
  .sticky{padding:10px 14px 8px}
  #q{height:48px;font-size:16px;padding:0 42px 0 42px}
  .sicon{left:13px;width:17px;height:17px}
  .tab{padding:8px 10px;font-size:13px}
  #list{padding:0 14px 34px}
}
@media (max-width:400px){
  h1{font-size:18px}
  .model{font-size:16px}
  .pname{font-size:13px}
}
</style>

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const PAGE = 60;

function norm(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/（/g,'(').replace(/）/g,')')
    .replace(/[，、]/g,',').replace(/\s+/g,'');
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
const PAREN = {'(':'[（(]',')':'[）)]','（':'[（(]','）':'[）)]'};
function tokenSrc(t){
  return t.split('').map(c => PAREN[c] || c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('');
}
function hl(text, tokens){
  if(!tokens.length) return esc(text);
  const src = tokens.map(tokenSrc).filter(Boolean).join('|');
  if(!src) return esc(text);
  let re;
  try{ re = new RegExp('(' + src + ')','gi'); }catch(e){ return esc(text); }
  return String(text).split(re).map((seg,i) => (i % 2 ? '<mark>' + esc(seg) + '</mark>' : esc(seg))).join('');
}

const CPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round"/></svg>';

/* ---------- 预建索引 ---------- */
MODELS.forEach(m => {
  m._hay = norm([m.m, m.c, m.g, m.n].concat(m.p.map(p => p.n + ' ' + p.c)).join(' '));
  m._zero = m.p.some(p => p.q === 0);
});
PARTS.forEach(p => {
  p._hay = norm([p.c, p.n].concat(p.ms).join(' '));
});

/* ---------- 状态 ---------- */
const state = { mode:'m', tokens:[], shown:0, list:[], onlyUpd:false };

/* ---------- 复制 ---------- */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
}
function copy(text, msg){
  const done = () => toast(msg || '已复制');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}

/* ---------- 渲染 ---------- */
function partHTML(p, i, tokens){
  const zero = p.q === 0;
  return '<div class="part">'
    + '<div class="no">' + (i + 1) + '</div>'
    + '<div class="pbody"><div class="pname">' + hl(p.n, tokens) + '</div>'
    +   '<span class="pcode" data-copy="' + esc(p.c) + '">' + hl(p.c, tokens) + CPY + '</span></div>'
    + (zero ? '<div class="qty zero">待核对</div>'
            : '<div class="qty">×' + p.q + '</div>')
    + '</div>';
}

function modelCard(m, tokens){
  const badge = (m.n ? '<span class="badge new">新增</span>' : '')
              + (m.u ? '<span class="badge upd">' + m.u + ' 更新</span>' : '')
              + (m._zero ? '<span class="badge warn">数量待核对</span>' : '');
  const txt = '【' + m.m + '】虚拟大保养包 · 共' + m.p.length + '项\n'
    + m.p.map((p, i) => (i + 1) + '. ' + p.c + '  ' + p.n + ' ×' + (p.q || 1)).join('\n');
  return '<div class="card" data-model="' + esc(m.m) + '">'
    + '<div class="mrow"><div class="model">' + hl(m.m, tokens) + badge + '</div>'
    +   '<div class="cnt">' + m.p.length + ' 个配件</div></div>'
    + '<div class="sub2"><span class="codeln" data-copy="' + esc(m.c) + '">产品编码 ' + hl(m.c, tokens) + CPY + '</span>'
    +   '<span class="gtag">' + esc(m.g) + '</span></div>'
    + '<div class="parts">' + m.p.map((p, i) => partHTML(p, i, tokens)).join('') + '</div>'
    + '<button class="copyall" data-copyall="' + esc(m.m) + '">复制整套清单</button>'
    + '</div>';
}

function partCard(p, tokens){
  return '<div class="pcard">'
    + '<div class="phead"><div class="pn">' + hl(p.n, tokens) + '</div>'
    +   '<div class="cnt">' + p.ms.length + ' 个型号</div></div>'
    + '<span class="pc" data-copy="' + esc(p.c) + '">' + hl(p.c, tokens) + CPY + '</span>'
    + '<div class="mlist"><div class="mlab">适用型号（点击复制）</div>'
    +   p.ms.map(mm => '<span class="mtag" data-copy="' + esc(mm) + '">' + hl(mm, tokens) + '</span>').join('')
    + '</div></div>';
}

const ALLTXT = {};
MODELS.forEach(m => { ALLTXT[m.m] = '【' + m.m + '】虚拟大保养包 · 共' + m.p.length + '项\n'
  + m.p.map((p, i) => (i + 1) + '. ' + p.c + '  ' + p.n + ' ×' + (p.q || 1)).join('\n'); });

function render(){
  const list = $('list');
  const tokens = state.tokens;
  let src = state.mode === 'm' ? MODELS : PARTS;
  if(state.mode === 'm' && state.onlyUpd) src = src.filter(x => x.n || x.u);
  const hit = tokens.length
    ? src.filter(x => tokens.every(t => x._hay.indexOf(t) >= 0))
    : src;
  state.list = hit;

  if(!hit.length){
    list.innerHTML = '<div class="empty"><div class="big">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="7"/><path d="M20 20l-4.6-4.6" stroke-linecap="round"/><path d="M8 10.5h5" stroke-linecap="round"/></svg>'
      + '</div>'
      + '<h3>没有查到「' + esc($('q').value.trim()) + '」</h3>'
      + '<p>建议只输型号后半段，例如 <code>EM05G</code>、<code>JQ01TS</code><br>'
      + '或直接输产品编码后 7 位 <code>0900050</code><br>'
      + '若仍无结果，该机型可能不在本次虚拟大保养包范围</p>'
      + (state.onlyUpd ? '<p style="margin-top:10px;color:#C4720C;font-weight:800">当前开启了「仅看本次更新」，点上方按钮关掉可查全部 ' + MODELS.length + ' 个型号</p>' : '')
      + '</div>';
    $('stat').innerHTML = '未匹配到结果';
    return;
  }

  const partCount = state.mode === 'm'
    ? hit.reduce((a, m) => a + m.p.length, 0)
    : 0;
  $('stat').innerHTML = state.mode === 'm'
    ? '命中 <b>' + hit.length + '</b> 个型号 · 共 <b>' + partCount + '</b> 个配件'
    : '命中 <b>' + hit.length + '</b> 种配件';

  const n = Math.min(hit.length, PAGE);
  state.shown = n;
  const body = hit.slice(0, n).map(x => state.mode === 'm' ? modelCard(x, tokens) : partCard(x, tokens)).join('');
  const more = hit.length > n
    ? '<div class="more"><button id="moreBtn">加载更多（还有 ' + (hit.length - n) + ' 条）</button></div>'
    : '';
  list.innerHTML = body + more;
  if(hit.length > n){
    $('moreBtn').onclick = () => {
      const from = state.shown, to = Math.min(hit.length, from + PAGE);
      const extra = hit.slice(from, to).map(x => state.mode === 'm' ? modelCard(x, tokens) : partCard(x, tokens)).join('');
      const btnWrap = $('list').querySelector('.more');
      btnWrap.insertAdjacentHTML('beforebegin', extra);
      state.shown = to;
      if(to >= hit.length) btnWrap.remove();
      else $('moreBtn').textContent = '加载更多（还有 ' + (hit.length - to) + ' 条）';
    };
  }
}

/* ---------- 交互 ---------- */
function update(){
  const raw = $('q').value.trim();
  $('clr').style.display = raw ? 'block' : 'none';
  state.tokens = raw ? raw.split(/\s+/).map(norm).filter(Boolean) : [];
  $('updBtn').hidden = state.mode !== 'm';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('q').addEventListener('input', update);
$('clr').addEventListener('click', () => { $('q').value = ''; update(); $('q').focus(); });

document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state.mode = b.dataset.mode;
    update();
  });
});

/* 仅看本次更新 */
$('updBtn').addEventListener('click', () => {
  state.onlyUpd = !state.onlyUpd;
  $('updBtn').classList.toggle('on', state.onlyUpd);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('list').addEventListener('click', e => {  const c = e.target.closest('[data-copy]');
  if(c){ copy(c.dataset.copy, '已复制：' + c.dataset.copy); return; }
  const a = e.target.closest('[data-copyall]');
  if(a){ copy(ALLTXT[a.dataset.copyall], '整套清单已复制，可直接粘贴'); return; }
});

/* 回车收起键盘 */
$('q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('q').blur(); } });

/* 按屏宽切换输入提示 */
function fitPlaceholder(){
  $('q').placeholder = window.innerWidth < 560
    ? '型号 / 编码 / 配件名，如 EM05G'
    : '型号 / 产品编码 / 配件名，如 EM05G、JQ01TS、叶轮';
}
fitPlaceholder();
window.addEventListener('resize', fitPlaceholder);

render();
</script>
</body>
</html>
